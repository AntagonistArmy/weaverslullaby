name: AEONIMUS FLARE validation
on:
  push:
    branches:
      - aeonimus/flare-runtime-v1-20261123
  pull_request:
    paths:
      - 'src/lib/field/**'
      - 'src/components/**'
      - '.github/workflows/aeonimus-flare.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:field
      - run: npm run build:dev
